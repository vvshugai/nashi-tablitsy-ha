name: Наши таблицы
version: "1.0.149"
slug: proxima_centauri
description: Семейный сайт с постоянной базой на SSD и переносом с Mac
url: https://github.com/vvshugai/proxima-centauri
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# Быстрые обновления: дополнение просит Home Assistant поставить новую версию (runtime.mjs, selfUpdate).
hassio_api: true
hassio_role: manager
homeassistant_api: true
image: ghcr.io/vvshugai/proxima-centauri-ha
ports:
  8080/tcp: 8080
  8443/tcp: 8443
ports_description:
  8080/tcp: Сайт по HTTP
  8443/tcp: Сайт по HTTPS
webui: http://[HOST]:[PORT:8080]
watchdog: http://[HOST]:[PORT:8080]/api/health
map:
  - share:ro
options:
  mode: migration
  site_host: homeassistant.local
  site_ip: ""
  site_url: ""
  timezone: Europe/Warsaw
  restore_archive: migration.tar.gz
  auto_update: true
  icloud_apple_id: ""
  icloud_app_password: ""
  icloud_calendar: Семья
  usda_api_key: ""
schema:
  mode: list(migration|active)
  site_host: str
  site_ip: str
  site_url: str
  timezone: str
  restore_archive: str
  auto_update: bool?
  icloud_apple_id: str?
  icloud_app_password: password?
  icloud_calendar: str?
  usda_api_key: password?
backup: cold
backup_exclude:
  - site/backups/*
